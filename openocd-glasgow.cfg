# OpenOCD config for Solum EFR32BG22 tags via Glasgow SWD remote bitbang.
#
# Start Glasgow first (separate terminal):
#   glasgow run swd-openocd --port A --pin-srst 0 --pin-swclk 1 --pin-swdio 2 \
#       -f 1000 -V 3.3 tcp:localhost:2222

adapter driver remote_bitbang
remote_bitbang port 2222
adapter speed 1000

# SWD must be selected before sourcing the target (remote_bitbang defaults to JTAG).
transport select swd

source [find target/efm32s2.cfg]
